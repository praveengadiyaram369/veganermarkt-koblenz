<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Seite nicht gefunden – Veganer Markt Koblenz</title>
<link rel="icon" type="image/png" href="img/image.png"/>
<meta name="theme-color" content="#0d1f07"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,700&family=DM+Sans:wght@300;400;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'DM Sans',sans-serif;
  background:#0d1f07;
  color:#fff;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  min-height:100vh;text-align:center;padding:2rem;
  background-image:
    radial-gradient(ellipse at 20% 50%,rgba(120,190,0,.2) 0%,transparent 60%),
    radial-gradient(ellipse at 80% 20%,rgba(120,190,0,.1) 0%,transparent 50%);
}
.logo-wrap{margin-bottom:2rem}
.logo-wrap img{height:72px;width:72px;object-fit:contain;border-radius:12px;opacity:.9}
.error-code{
  font-family:'Fraunces',serif;
  font-size:clamp(6rem,20vw,11rem);
  font-weight:900;line-height:1;
  color:rgba(255,255,255,.07);
  letter-spacing:-.02em;margin-bottom:-.5rem;
}
.icon{font-size:3.5rem;margin-bottom:1rem;display:block;animation:wobble 3s ease infinite}
h1{
  font-family:'Fraunces',serif;
  font-size:clamp(1.8rem,5vw,3rem);
  font-weight:700;margin-bottom:1rem;line-height:1.2;
}
h1 em{font-style:italic;color:#d4f57a}
p{font-size:.98rem;font-weight:300;color:rgba(255,255,255,.65);max-width:420px;line-height:1.85;margin-bottom:2.5rem}
.btns{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center;margin-bottom:2.5rem}
.btn{
  display:inline-block;padding:.75rem 1.8rem;
  font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;
  border-radius:50px;cursor:pointer;transition:all .25s;text-decoration:none;
}
.btn-green{background:#78be00;color:#0d1f07;border:2px solid #78be00}
.btn-green:hover{background:#9cd900;transform:translateY(-2px)}
.btn-ghost{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.35)}
.btn-ghost:hover{background:rgba(255,255,255,.08);transform:translateY(-2px)}
.hint{font-size:.82rem;font-weight:300;color:rgba(255,255,255,.35)}
.hint a{color:#d4f57a;text-decoration:none}
.hint a:hover{text-decoration:underline}
@keyframes wobble{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
@media(max-width:480px){.btns{flex-direction:column;align-items:center;width:100%}.btn{width:100%;max-width:260px;text-align:center}}
</style>
</head>
<body>
<div class="logo-wrap"><img src="img/image.png" alt="Veganer Markt Koblenz Logo"/></div>
<div class="error-code">404</div>
<span class="icon">🌿</span>
<h1>Diese Seite ist<br><em>nicht zu finden</em>.</h1>
<p>Die gesuchte Seite konnte nicht gefunden werden. Vielleicht war der Link veraltet oder die Adresse hat sich geändert.</p>
<div class="btns">
  <a href="index.html" class="btn btn-green">🏠 Zurück zur Startseite</a>
  <a href="index.html#programm" class="btn btn-ghost">🎵 Programm</a>
  <a href="index.html#anfahrt" class="btn btn-ghost">📍 Anfahrt</a>
</div>
<p class="hint">Noch Fragen? Schreib uns:<br/><a href="mailto:kontakt@ariwa-koblenz.de">kontakt@ariwa-koblenz.de</a></p>
</body>
</html>
